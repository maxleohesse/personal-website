<!--
  ============================================================
  NOTE TEMPLATE — how to publish a new note (3 steps, ~2 min)
  ============================================================

  1. Copy this whole folder structure:
       notes/_template.html  ->  notes/your-note-slug/index.html
     Use a short, lowercase, hyphenated slug. It becomes the URL:
       maxleohesse.com/notes/your-note-slug/

  2. In the copied file, replace the four marked spots:
       [TITLE]        the headline
       [DATE]         e.g. "August 2026"
       [DESCRIPTION]  one sentence, used for search results and link previews
       [SLUG]         the folder name you chose
     Then write your paragraphs where it says WRITE HERE.
     Each paragraph goes in its own <p>...</p>.

  3. Add the note to the top of the list in notes/index.html:

       <a class="note-item" href="your-note-slug/">
         <span class="note-item__date">August 2026</span>
         <h2 class="note-item__title">Your title</h2>
         <p class="note-item__teaser">One line that makes someone want to read it.</p>
       </a>

     Newest goes first.

  Then commit and push — it's live in about a minute.

  Tips
  - Special characters: use &rsquo; for an apostrophe, &mdash; for an em dash,
    &amp; for an ampersand.
  - A link inside a paragraph:
      <a href="https://example.com" target="_blank" rel="noopener" class="text-link">text</a>
  - If you change css/style.css or js/main.js, bump ?v=10 everywhere, otherwise
    people keep seeing the cached old version.
  - Delete this comment block in your copy.
-->
